services:
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    image: gabster_app:latest
    container_name: gabster_api
    restart: unless-stopped
    network_mode: host
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=production
      - SERVER_HOST=0.0.0.0
      - SERVER_PORT=8000
      - POSTGRES_SERVER=localhost
      - POSTGRES_PORT=5433
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secure_postgres_password
      - DATABASE_URL=postgresql+asyncpg://postgres:secure_postgres_password@localhost:5433/gabster_ai
      - DATABASE_ADMIN_URL=postgresql+asyncpg://postgres:secure_postgres_password@localhost:5433/gabster_ai
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_URL=redis://localhost:6379/0
      - CELERY_BROKER_URL=redis://localhost:6379/1
      - CELERY_RESULT_BACKEND=redis://localhost:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      network: host
    image: gabster_app:latest
    container_name: gabster_worker
    restart: unless-stopped
    network_mode: host
    command: ["celery", "-A", "app.workers.celery_app", "worker", "--loglevel=INFO", "-Q", "ai,ingestion,campaigns,default"]
    env_file:
      - ../.env
    environment:
      - ENVIRONMENT=production
      - POSTGRES_SERVER=localhost
      - POSTGRES_PORT=5433
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=secure_postgres_password
      - DATABASE_URL=postgresql+asyncpg://postgres:secure_postgres_password@localhost:5433/gabster_ai
      - DATABASE_ADMIN_URL=postgresql+asyncpg://postgres:secure_postgres_password@localhost:5433/gabster_ai
      - REDIS_HOST=localhost
      - REDIS_PORT=6379
      - REDIS_URL=redis://localhost:6379/0
      - CELERY_BROKER_URL=redis://localhost:6379/1
      - CELERY_RESULT_BACKEND=redis://localhost:6379/2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  postgres:
    image: pgvector/pgvector:pg16
    container_name: gabster_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabster_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_postgres_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d gabster_ai"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gabster_network

  redis:
    image: redis:7-alpine
    container_name: gabster_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - gabster_network

volumes:
  postgres_data:
  redis_data:

networks:
  gabster_network:
    driver: bridge
