services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gabster_dev_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gabster_ai
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secure_postgres_password
    ports:
      - "5433:5432"
    volumes:
      - dev_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gabster_dev_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dev_redis_data:/data

volumes:
  dev_postgres_data:
  dev_redis_data:
