[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "gabster-ai"
version = "1.0.0"
description = "Enterprise-Grade Omnichannel AI Customer Operations SaaS Platform"
authors = ["Gabster AI Core Engineering Team <engineering@gabster.ai>"]
readme = "README.md"
packages = [{include = "app"}]

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.0"
uvicorn = {extras = ["standard"], version = "^0.30.6"}
pydantic = "^2.9.2"
pydantic-settings = "^2.5.2"
sqlalchemy = {extras = ["asyncio"], version = "^2.0.35"}
asyncpg = "^0.29.0"
alembic = "^1.13.3"
pgvector = "^0.3.5"
redis = {extras = ["hiredis"], version = "^5.1.0"}
celery = "^5.4.0"
flower = "^2.0.1"
httpx = "^0.27.2"
python-jose = {extras = ["cryptography"], version = "^3.3.0"}
passlib = {extras = ["bcrypt"], version = "^1.7.4"}
cryptography = "^43.0.1"
structlog = "^24.4.0"
prometheus-fastapi-instrumentator = "^7.0.0"
opentelemetry-api = "^1.27.0"
opentelemetry-sdk = "^1.27.0"
opentelemetry-instrumentation-fastapi = "^0.48b0"
opentelemetry-instrumentation-sqlalchemy = "^0.48b0"
tenacity = "^9.0.0"
tiktoken = "^0.7.0"
pydub = "^0.25.1"
python-multipart = "^0.0.12"
email-validator = "^2.2.0"
phonenumbers = "^8.13.45"
pytz = "^2024.2"
croniter = "^3.0.3"
stripe = "^10.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.3"
pytest-asyncio = "^0.24.0"
pytest-cov = "^5.0.0"
pytest-mock = "^3.14.0"
factory-boy = "^3.3.1"
faker = "^29.0.0"
ruff = "^0.6.8"
black = "^24.8.0"
mypy = "^1.11.2"
types-pytz = "^2024.2.0.20240913"
types-redis = "^4.6.0.20240903"
types-croniter = "^2.0.0.20240423"

[tool.black]
line-length = 100
target-version = ['py312']

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "C4", "ARG", "SIM"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --cov=app --cov-report=term-missing --cov-report=xml"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
